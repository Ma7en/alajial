			var itemArray = ["slide1. NEED OF COMPUTERS","slide2. Amelia is having a drawing competition at school. She needed a sketchbook to see some examples of drawings. She went to buy it, but the store owner said they currently don\\'t have the drawing books in stock. She was worried and told her father. Her father said even if you don\u2019t have a sketchbook,\u00a0 you\u00a0 can get some examples and ideas for drawing from another source . \u00a0She wonders, how? she asked. Can we also help her to get the examples to win the competition?","slide3. This project emphasizes the learning of computers and other smart devices that are used to help our lives develop faster and grow more efficiently.","slide4. \u2022 To learn about computers and other smart devices. \u2022 To acquire knowledge about the internet. \u2022 To discover the benefits of these smart devices.","slide5. A Computer is a machine that can store\u00a0 information. \u00a0It uses this information to do tasks. This information is of different kinds. It can be made up of words, numbers,\u00a0 images ,\u00a0 and\u00a0 videos . Computers around us: Desktop Computers: These types of computers have separate parts. They are kept on desks or tables. These computers are difficult to move and carry around.","slide6. \u25cf Desktop computers are used in hotels, hospitals, offices, railway stations and airports. \u25cf In these spaces, computers are kept in one place. They are not moved around.","slide7. Laptop: Laptop computers are smaller in size. These can be easily carried anywhere. They do not need to be kept in one place. All the parts of a computer are put together into a laptop. A laptop does not need a desk to be used. \u25cf Laptops are used by people who work from different places. \u25cf Laptops are used when available space is less. \u25cf They are used in homes, small offices, and while traveling.","slide8. Tablets: These types of computers are smaller than a laptop. They are almost the size of our school notebooks. Tablets are light weight and easier to carry everywhere. \u25cf Tablets are used for simple and fun tasks. \u25cf They are used to watch videos, play games, and click pictures. \u25cf We can search for information and read books using tablets.","slide9. Bytes: The Internet is a connection between computers. Computers can share information using the internet. Different types of\u00a0 devices \u00a0can use the internet.","slide10. Smartphones: Smartphones are mobile phones which can do some functions of computers. They are used to make calls and use the\u00a0 internet . Smartphones are smaller than tablets. They can fit into pockets. \u25cf Smartphones do the work of a mobile phone and computer. \u25cf They can be used to click pictures and search for information. \u25cf Smartphones can be used to look at maps and play games. \u25cf They can be used to send emails","slide11. Bytes: Data is information that is stored and used for doing tasks. It can be of different forms. Data can be words, numbers, pictures, videos, or sounds.","slide12. One computer can be used to do many different tasks. We do not need to use different devices . \u00a0In this way, computers can also save space in our homes. Computer can do some tasks like: \u25cf Playing music \u25cf Playing videos \u25cf Taking pictures \u25cf Letting us write using the keyboard \u25cf Calculating numbers Computers can also do many more tasks.","slide13. There are many reasons to use a computer. \u25cf Computers\u00a0 can\u00a0 work\u00a0 faster\u00a0 than\u00a0 us \u25cf Computers\u00a0 do\u00a0 not\u00a0 make\u00a0 mistakes \u25cf Computers do not get tired after work \u25cf Computers can save a lot of data \u25cf Work can be completed in less time with computers","slide14. \uf0a7 What does the term device indicate? \uf0a7 Give some examples of smart devices.","slide15."];

            var i = 0;

			var myInterval = setInterval(myTimer, 1000);
			function myTimer() {
				var navigationSlides = document.querySelector(".navigation-controls__label").innerHTML;
				var activeSlide = navigationSlides.split(" ")
				i = activeSlide[0] - 1;
				if(i >= 0) {
					clearInterval(myInterval)
				}
			}
            var textReader = document.getElementById("text-reader");
			var textReaderPause = document.getElementById("text-reader-pause");
			textReaderPause.style.display = "none";
			var textReaderResume = document.getElementById("text-reader-resume");
			textReaderResume.style.display = "none";
			var speaker = false;
			var pauseSpeaker = false;

            textReader.addEventListener("click", function(){
				clickNextString = itemArray[i];
				const utterance = new SpeechSynthesisUtterance(clickNextString);
				synthPPT.speak(utterance);
				textReader.style.display = "none";
				textReaderPause.style.display = "block";
				textReaderResume.style.display = "none";
				speaker = true;
			})

            textReaderPause.addEventListener("click", function(){
				textReader.style.display = "none";
				textReaderPause.style.display = "none";
				textReaderResume.style.display = "block";
				synthPPT.pause();
				speaker = false;
				pauseSpeaker = true;
			});

            textReaderResume.addEventListener("click", function(){
				synthPPT.resume();
				textReader.style.display = "block";
				textReaderPause.style.display = "none";
				textReaderResume.style.display = "none";
				speaker = true;
				pauseSpeaker = false;
			});

			});
			var clickPreviousButton = document.querySelector(".navigation-controls__button_prev");

				synthPPT.cancel();
				i = i-1;
				if(speaker == true) textReader.click();
